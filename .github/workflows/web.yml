# Tests and builds apps/web on every push to main that touches it, and on pull requests, so a broken
# build shows before a release. Nothing is published here: the site goes out with a release (release.yml).
name: Web

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/web.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
